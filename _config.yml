title: "陈怀桂 · Agent / AI 应用后端"
name: "陈怀桂"
description: "2028 届人工智能硕士，具备 Java 后端工作经历。关注多 Agent 编排、任务执行与可追溯的 AI 应用。"
url: "https://incecheng.github.io"
baseurl: ""
repository: "inceCheng/inceCheng.github.io"
locale: "zh-CN"
timezone: "Asia/Shanghai"
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
future: false
collections:
  case_studies:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: portfolio
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
kramdown:
  input: GFM
  auto_ids: true
# Keep old theme samples, internal notes and development files out of the website.
exclude:
  - _pages
  - _posts
  - _drafts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - .specstory
  - .devcontainer
  - .github
  - .bundle
  - vendor
  - node_modules
  - scripts
  - local
  - tmp
  - output
  - docs
  - README.md
  - HOMEPAGE_PLAN.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/cv-layout.css
  - assets/css/cv-style.css
  - assets/css/collapse.css
  - assets/fonts
  - assets/webfonts
  - assets/js/main.min.js
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/collapse.js
  - images
  - files/bibtex1.bib
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
