<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% assign page_description = page.description | default: site.description %}
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page_description | escape }}">
    <meta name="author" content="{{ site.data.profile.name }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta property="og:type" content="{% if page.collection == 'case_studies' %}article{% else %}website{% endif %}">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page_description | escape }}">
    <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/portfolio/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <div class="site-shell">
      {% include portfolio-nav.html %}
      <main id="main">{{ content }}</main>
      {% include portfolio-footer.html %}
    </div>
  </body>
</html>
